[pytest]
# pytest 配置文件 - GOP 预授权审核系统测试套件

# 测试文件发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# BDD 特性文件路径
bdd_features_base_dir = tests/features

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试（需要真实API调用）
    bdd: BDD 行为驱动测试
    dao: 数据访问层测试
    service: 服务层测试
    utils: 工具层测试
    llm: LLM 服务测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*pkg_resources.*:DeprecationWarning